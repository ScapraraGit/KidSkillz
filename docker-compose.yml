  #      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chorechampz}"]
  #      interval: 5s
  #      timeout: 5s
  #      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    #    depends_on:
    #      db:
    #        condition: service_healthy
    environment:
      # DATABASE_URL must come from .env or the deploy environment. Never hardcode
      # credentials in this file — it's checked into git.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (32+ random chars)}
      JWT_TTL: ${JWT_TTL:-7d}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      UPLOAD_DIR: /data/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      BILLING_TRIAL_DAYS: ${BILLING_TRIAL_DAYS:-10}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_BASIC_MONTHLY: ${STRIPE_PRICE_BASIC_MONTHLY:-}
      STRIPE_PRICE_PREMIUM_MONTHLY: ${STRIPE_PRICE_PREMIUM_MONTHLY:-}
      APP_URL: ${APP_URL:-http://localhost:5173}
      SOCIAL_LOGIN_ENABLED: ${SOCIAL_LOGIN_ENABLED:-false}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      DEVICE_PAIRING_ENABLED: ${DEVICE_PAIRING_ENABLED:-false}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - upload-data:/data/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_BILLING_ENABLED: ${VITE_BILLING_ENABLED:-false}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_TURNSTILE_SITEKEY: ${VITE_TURNSTILE_SITEKEY:-}
        VITE_SOCIAL_LOGIN_ENABLED: ${VITE_SOCIAL_LOGIN_ENABLED:-false}
        VITE_GOOGLE_OAUTH_CLIENT_ID: ${VITE_GOOGLE_OAUTH_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:8080"

volumes:
  db-data:
  upload-data:
