name: Nightly Jobs

# Runs background maintenance jobs that don't fit a long-lived process:
#   - penalty-sweep: posts negative-credit entries for yesterday's missed RECURRING
#     tasks (idempotent; only runs against families with penaltiesEnabled).
#   - photo-purge: deletes proof photos beyond each family's retention window.
#
# Schedule: 09:10 UTC (~02:10 America/Phoenix). Adjust if your busiest TZ shifts.
# Manual: trigger via "Run workflow" in the Actions tab.

on:
  schedule:
    - cron: "10 9 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - penalty-sweep
          - photo-purge
          - ledger-recon

concurrency:
  group: nightly-jobs
  cancel-in-progress: false

jobs:
  nightly:
    name: Run nightly maintenance jobs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Use the dedicated prod secret so this job can never accidentally run
      # against the shared dev/staging Neon DB. Pair with the hostname guard
      # below (EXPECTED_DB_HOST_ALLOWLIST) for defense in depth.
      DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      # Comma-separated hostname suffix allowlist enforced by
      # apps/api/src/lib/assert-job-db.ts. Set this to the prod Neon project
      # host (e.g. "ep-prod-xyz.us-east-2.aws.neon.tech"). If unset, the guard
      # is a no-op — keep it set in this workflow.
      EXPECTED_DB_HOST_ALLOWLIST: ${{ secrets.EXPECTED_DB_HOST_ALLOWLIST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          version: 9.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify required secrets
        run: |
          missing=0
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_PROD secret is missing or empty. Set it in repo Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "$EXPECTED_DB_HOST_ALLOWLIST" ]; then
            echo "::error::EXPECTED_DB_HOST_ALLOWLIST secret is missing. Set it to the prod Neon hostname suffix to enable the job DB guard."
            missing=1
          fi
          [ "$missing" = "0" ]

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @chorechampz/api exec prisma generate

      - name: Penalty sweep
        if: ${{ github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'penalty-sweep' }}
        run: pnpm --filter @chorechampz/api jobs:penalty-sweep:ci

      - name: Photo purge
        if: ${{ github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'photo-purge' }}
        run: pnpm --filter @chorechampz/api jobs:photo-purge:ci

      - name: Ledger reconciliation
        if: ${{ github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'ledger-recon' }}
        run: pnpm --filter @chorechampz/api jobs:ledger-recon:ci
