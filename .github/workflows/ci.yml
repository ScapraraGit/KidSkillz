name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Prisma validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        env:
          # Bogus URL — prisma generate parses but does not connect.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
        run: pnpm --filter @chorechampz/api exec prisma generate

      - name: Validate Prisma schema
        env:
          # Bogus URL — prisma validate parses but does not connect.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
        run: pnpm --filter @chorechampz/api exec prisma validate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        env:
          # Bogus URL — env.ts requires DATABASE_URL at module load. Prisma is
          # lazy-connected so this is never dialed. DB-dependent tests are
          # gated on RUN_DB_TESTS=1 (unset here) so dbIt skips them.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
          JWT_SECRET: "ci-not-real-secret"
        run: pnpm test
